[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-calculator"
version = "0.1.0"
description = "A well-structured, modular, and safe simple calculator with CLI and programmatic API"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Developer" }
]
keywords = ["calculator", "arithmetic", "math", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.scripts]
calculator = "calculator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
